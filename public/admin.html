<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理 — MC Server Monitor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔧</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .admin-container {
      max-width: 900px;
      margin: 28px auto;
      padding: 0 20px;
    }
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .admin-header h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .back-link {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 20px;
      transition: var(--transition);
    }
    .back-link:hover {
      background: rgba(255,255,255,0.08);
      color: var(--text-primary);
    }

    /* Login */
    .login-box {
      max-width: 380px;
      margin: 80px auto;
      padding: 32px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--glass-radius-xl);
      backdrop-filter: var(--glass-blur);
      text-align: center;
    }
    .login-box h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
    }

    /* Glass Inputs */
    .glass-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: var(--transition);
      background: rgba(255,255,255,0.04);
      color: var(--text-primary);
      margin-bottom: 10px;
    }
    .glass-input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(0,122,255,0.15);
    }
    .glass-input::placeholder { color: var(--text-quaternary); }
    textarea.glass-input { resize: vertical; min-height: 60px; }

    /* Table */
    .admin-table {
      width: 100%;
      border-collapse: collapse;
    }
    .admin-table thead { display: none; }

    .admin-table tr {
      display: block;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--glass-radius);
      backdrop-filter: var(--glass-blur);
      margin-bottom: 10px;
      padding: 16px 20px;
      transition: var(--transition);
    }
    .admin-table tr:hover {
      border-color: var(--glass-border-hover);
    }

    .admin-table td {
      display: inline-block;
      padding: 2px 0;
      font-size: 14px;
      color: var(--text-secondary);
    }

    .admin-table td:first-child {
      display: block;
      font-size: 16px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }

    .admin-table td:nth-child(2) {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 13px;
      color: var(--blue);
      margin-right: 16px;
    }

    .admin-table td:nth-child(3) {
      font-size: 13px;
      color: var(--text-tertiary);
      margin-right: 16px;
    }

    .admin-table td:nth-child(4) {
      font-size: 12px;
      color: var(--text-tertiary);
    }

    .admin-table td:nth-child(5) {
      float: right;
      display: flex;
      gap: 8px;
    }

    .admin-table .actions button {
      padding: 6px 14px;
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      background: rgba(255,255,255,0.04);
      color: var(--text-secondary);
      transition: var(--transition);
      font-family: inherit;
    }
    .admin-table .actions .edit-btn { color: var(--blue); }
    .admin-table .actions .edit-btn:hover { background: rgba(0,122,255,0.1); border-color: var(--blue); }
    .admin-table .actions .del-btn { color: var(--red); }
    .admin-table .actions .del-btn:hover { background: rgba(255,59,48,0.1); border-color: var(--red); }

    /* Modal Overlay (reuse detail-overlay) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }

    .modal-box {
      background: rgba(20, 20, 40, 0.85);
      backdrop-filter: var(--glass-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--glass-radius-xl);
      width: 90%;
      max-width: 460px;
      padding: 28px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
      animation: slideUp 0.35s var(--ease);
    }
    .modal-box h3 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .modal-btns {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 12px;
    }

    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 40, 0.9);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 14px;
      z-index: 999;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .toast.show { opacity: 1; }

    @media (min-width: 768px) {
      .admin-table thead { display: table-header-group; }
      .admin-table {
        border-collapse: separate;
        border-spacing: 0 8px;
      }
      .admin-table tr { display: table-row; border-radius: 0; }
      .admin-table td {
        display: table-cell;
        padding: 14px 16px;
        vertical-align: middle;
      }
      .admin-table td:first-child {
        display: table-cell;
        font-size: 15px;
        margin-bottom: 0;
        padding-left: 20px;
      }
      .admin-table td:last-child { padding-right: 20px; }
      .admin-table td:nth-child(5) { float: none; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <div class="logo">⛏</div>
        <h1>管理</h1>
      </div>
      <div class="header-right">
        <a href="/">← 返回</a>
      </div>
    </div>
  </header>

  <!-- Login -->
  <div class="login-box" id="loginBox">
    <h2>管理员验证</h2>
    <input type="password" class="glass-input" id="adminKeyInput" placeholder="密钥" onkeydown="if(event.key==='Enter') verifyLogin()">
    <button class="glass-btn" onclick="verifyLogin()" style="width:100%;justify-content:center">验证</button>
    <p id="loginError" style="color:var(--red);font-size:13px;margin-top:8px;display:none"></p>
  </div>

  <!-- Admin Panel -->
  <div class="admin-container" id="adminPanel" style="display:none">
    <div class="admin-header">
      <h2>服务器管理</h2>
      <button class="glass-btn" onclick="openAddModal()">+ 添加</button>
    </div>

    <table class="admin-table">
      <thead>
        <tr>
          <th>名称</th>
          <th>IP</th>
          <th>端口</th>
          <th>状态</th>
          <th style="text-align:right">操作</th>
        </tr>
      </thead>
      <tbody id="adminTbody">
        <tr><td colspan="5" style="text-align:center;color:var(--text-tertiary);padding:32px">加载中...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
      <h3 id="modalTitle">添加服务器</h3>
      <input type="text" class="glass-input" id="modalName" placeholder="服务器名称">
      <input type="text" class="glass-input" id="modalIp" placeholder="IP 地址">
      <input type="number" class="glass-input" id="modalPort" placeholder="端口（默认 25565）" value="25565">
      <textarea class="glass-input" id="modalDesc" placeholder="简介（可选）"></textarea>
      <input type="hidden" id="modalEditId">
      <div class="modal-btns">
        <button class="glass-btn outline" onclick="closeModal()">取消</button>
        <button class="glass-btn" id="modalSubmitBtn" onclick="submitModal()">保存</button>
      </div>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div class="modal-overlay" id="delModalOverlay">
    <div class="modal-box" style="text-align:center">
      <h3>确认删除？</h3>
      <p style="color:var(--text-secondary);font-size:14px;margin-bottom:16px" id="delModalName">-</p>
      <div class="modal-btns" style="justify-content:center">
        <button class="glass-btn outline" onclick="closeDelModal()">取消</button>
        <button class="glass-btn danger" id="delConfirmBtn" onclick="confirmDelete()">删除</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="/js/admin.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MC Server Monitor - 我的世界服务器监控</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <div class="logo">M</div>
        <h1>Server Monitor</h1>
      </div>
      <div class="header-right">
        <a href="/search.html" class="nav-link" title="搜索"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></a>
        <button class="google-btn-sm" onclick="openAddModal()" style="background:var(--primary);color:#fff;border:none;padding:6px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s">＋ 收录</button>
        <a href="/admin.html" class="admin-link">管理</a>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero">
    <h2>寻找你的下一个服务器</h2>
    <p>实时监控所有收录的 Minecraft 服务器在线状态，找到最活跃的玩家社区</p>
  </section>

  <!-- Stats -->
  <div class="stats-bar" id="statsBar">
    <div class="stat-card">
      <div class="num" id="totalServers">-</div>
      <div class="label">已收录服务器</div>
    </div>
    <div class="stat-card">
      <div class="num green" id="onlineServers">-</div>
      <div class="label">当前在线</div>
    </div>
    <div class="stat-card rate-card">
      <div class="rate-chart">
        <div class="rate-bar-bg">
          <div class="rate-bar-fill" id="rateBar"></div>
        </div>
        <div class="rate-label">
          <span class="num green" id="ratePercent">0%</span>
          <span class="label">总在线率</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Server List -->
  <div class="container">
    <div class="section-title" id="sectionTitle">全部服务器</div>
    <div class="server-grid" id="serverGrid"></div>
    <div id="sentinel" class="sentinel" style="text-align:center;padding:24px 0 40px;color:var(--gray);font-size:13px"></div>
  </div>

  <!-- Detail Overlay -->
  <div class="detail-overlay" id="detailOverlay" onclick="closeDetail(event)">
    <div class="detail-panel" id="detailPanel">
      <button class="close-btn" onclick="closeDetail()">&times;</button>
      <h2 id="detailName">-</h2>
      <div class="detail-ip" id="detailIp">-</div>
      <div class="detail-desc" id="detailDesc">-</div>
      <div class="detail-meta">
        <div>
          <div class="num green" id="detailOnline">0</div>
          <div class="lbl">当前在线</div>
        </div>
        <div>
          <div class="num blue" id="detailLatency">0</div>
          <div class="lbl">延迟 (ms)</div>
        </div>
        <div>
          <div class="num" id="detailVersion">-</div>
          <div class="lbl">版本</div>
        </div>
      </div>
      <div class="uptime-bar">
        <div class="range-btns">
          <button class="range-btn active" data-range="24h">24小时</button>
          <button class="range-btn" data-range="7d">7天</button>
          <button class="range-btn" data-range="30d">30天</button>
        </div>
        <div class="uptime-text">在线率：<strong id="detailUptime">-</strong></div>
        <div class="peak-info" id="peakInfo">
          <span>📈 峰值：<strong id="peakPlayers">-</strong> 人</span>
        </div>
        <div class="chart-wrapper">
          <div class="chart-container" id="chartContainer">
            <div class="chart-loading">加载历史数据...</div>
          </div>
          <div class="chart-timeline">
            <span id="tlStart">-</span>
            <span id="tlEnd">-</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add Server Modal (Public) -->
  <div class="detail-overlay" id="addModalOverlay">
    <div class="detail-panel" style="max-width:460px">
      <button class="close-btn" onclick="closeAddModal()">&times;</button>
      <h2 style="font-family:'Google Sans',sans-serif;font-size:22px;margin-bottom:16px">📡 收录服务器</h2>
      <p style="color:var(--gray);font-size:14px;margin-bottom:20px">填写你发现的好服务器，分享给更多玩家！</p>
      <input type="text" class="google-input" id="addName" placeholder="服务器名称（如：云栖小站）" maxlength="50">
      <input type="text" class="google-input" id="addIp" placeholder="IP地址（如：mc.example.com）" maxlength="200">
      <input type="number" class="google-input" id="addPort" placeholder="端口（默认 25565）" value="25565">
      <textarea class="google-input" id="addDesc" placeholder="简介：版本、特色、玩法（可选）" maxlength="500"></textarea>
      <div style="display:flex;gap:12px;justify-content:flex-end;margin-top:8px">
        <button class="google-btn outline" onclick="closeAddModal()">取消</button>
        <button class="google-btn" id="addSubmitBtn" onclick="submitPublicAdd()">提交收录</button>
      </div>
      <p id="addResult" style="font-size:13px;margin-top:12px;display:none"></p>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    MC Server Monitor &mdash; 每5分钟自动检测一次 &middot; 数据保留30天
  </div>

  <script src="/js/main.js?v=5"></script>
</body>
</html>

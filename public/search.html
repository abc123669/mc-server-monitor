<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索 — MC Server Monitor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .search-wrap {
      max-width: 680px;
      margin: 48px auto 32px;
      padding: 0 20px;
    }
    .search-box {
      position: relative;
      max-width: 520px;
      margin: 0 auto;
    }
    .search-box svg {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--text-tertiary);
    }
    .search-box input {
      width: 100%;
      padding: 14px 18px 14px 48px;
      border: 1px solid var(--glass-border);
      border-radius: 28px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: var(--transition);
      background: var(--glass-bg);
      color: var(--text-primary);
      backdrop-filter: var(--glass-blur);
    }
    .search-box input:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(0,122,255,0.15), 0 4px 20px rgba(0,122,255,0.1);
    }
    .search-box input::placeholder { color: var(--text-quaternary); }

    .results-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 20px 60px;
    }

    .result-count {
      font-size: 13px;
      color: var(--text-tertiary);
      margin-bottom: 16px;
    }

    .result-empty {
      text-align: center;
      padding: 60px 20px;
    }
    .result-empty h3 { font-size: 18px; font-weight: 600; margin-bottom: 8px; }
    .result-empty p { font-size: 14px; color: var(--text-tertiary); }
    .result-empty svg { margin-bottom: 16px; opacity: 0.3; }

    .server-card.search-result {
      padding: 16px 20px;
      margin-bottom: 8px;
      border-radius: var(--glass-radius);
      cursor: pointer;
    }
    .server-card.search-result .name {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .server-card.search-result .ip-row {
      font-size: 13px;
      color: var(--blue);
      font-family: 'SF Mono', 'Fira Code', monospace;
      margin-bottom: 4px;
    }
    .server-card.search-result .desc {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .server-card.search-result .meta {
      font-size: 12px;
      color: var(--text-tertiary);
      display: flex;
      gap: 16px;
      align-items: center;
    }
    .server-card.search-result .meta .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
    }
    .server-card.search-result .meta .dot.online { background: var(--green); box-shadow: 0 0 6px rgba(52,199,89,0.4); }
    .server-card.search-result .meta .dot.offline { background: rgba(255,255,255,0.15); }

    .dormant-tag {
      font-size: 10px;
      color: var(--text-tertiary);
      background: rgba(255,255,255,0.06);
      padding: 2px 8px;
      border-radius: 8px;
    }

    @media (max-width: 600px) {
      .search-wrap { margin: 32px auto 24px; }
      .header h1 { font-size: 0; }
      .results-wrap { padding: 0 12px 40px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="header-left">
        <div class="logo">⛏</div>
        <h1>搜索</h1>
      </div>
      <div class="header-right">
        <a href="/" class="active">首页</a>
        <a href="/admin.html">管理</a>
      </div>
    </div>
  </header>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-box">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="searchInput" placeholder="搜索服务器..." autofocus>
    </div>
  </div>

  <!-- Results -->
  <div class="results-wrap" id="resultsWrap">
    <div class="result-count" id="resultCount"></div>
    <div id="resultList"></div>
  </div>

  <script>
  const input = document.getElementById('searchInput');
  const list = document.getElementById('resultList');
  const count = document.getElementById('resultCount');
  let timer;

  input.addEventListener('input', () => {
    clearTimeout(timer);
    const q = input.value.trim();
    if (!q) { list.innerHTML = ''; count.textContent = ''; return; }
    timer = setTimeout(() => doSearch(q), 300);
  });

  async function doSearch(q) {
    list.innerHTML = '<div class="result-empty"><p>搜索中...</p></div>';
    try {
      const res = await fetch('/api/servers?q=' + encodeURIComponent(q) + '&show=all');
      const data = await res.json();
      render(data, q);
    } catch(e) {
      list.innerHTML = '<div class="result-empty"><h3>搜索出错</h3><p>请重试</p></div>';
    }
  }

  function render(arr, q) {
    if (!arr || arr.length === 0) {
      count.textContent = '';
      list.innerHTML = `
        <div class="result-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" opacity="0.3"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><line x1="8" y1="8" x2="14" y2="14"/></svg>
          <h3>没有找到相关结果</h3>
          <p>试试其他关键词</p>
        </div>`;
      return;
    }
    count.textContent = `找到 ${arr.length} 个服务器`;
    list.innerHTML = arr.map(s => {
      const online = s.online === 1;
      const ip = s.port && s.port !== 25565 ? s.ip + ':' + s.port : s.ip;
      return `<div class="server-card search-result" onclick="location.href='/'">
        <div class="name">${E(s.name)}</div>
        <div class="ip-row">${E(ip)}</div>
        <div class="desc">${E(s.description || '暂无简介')}</div>
        <div class="meta">
          <span><span class="dot ${online ? 'online' : 'offline'}"></span>${online ? (s.players_online + ' 人在线') : '离线'}</span>
          <span>${s.latency >= 0 ? s.latency + 'ms' : '-'}</span>
          ${s.version ? '<span>' + E(shortV(s.version)) + '</span>' : ''}
          ${s.status === 'dormant' ? '<span class="dormant-tag">休眠</span>' : ''}
        </div>
      </div>`;
    }).join('');
  }

  function E(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  function shortV(v) { const m = v.match(/([\\d.]+)/); return m ? m[1] : v.slice(0,12); }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索 - MC Server Monitor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛏</text></svg>">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #fff; color: #202124; min-height: 100vh; }

    /* Header */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      max-width: 900px; margin: 0 auto; padding: 12px 20px;
    }
    .header-left { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 32px; height: 32px; border-radius: 50%; background: #1a73e8;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 700; font-size: 17px; flex-shrink: 0;
    }
    .header h1 { font-size: 18px; font-weight: 400; color: #5f6368; }
    .header-right { display: flex; align-items: center; gap: 6px; }
    .header-right a {
      text-decoration: none; font-size: 14px; color: #5f6368; padding: 6px 12px; border-radius: 20px;
    }
    .header-right a:hover { background: #f1f3f4; }
    .header-right .active { color: #1a73e8; }

    /* Search area */
    .search-wrap {
      max-width: 700px; margin: 60px auto 40px; padding: 0 20px;
    }
    .search-box {
      position: relative; max-width: 560px; margin: 0 auto;
    }
    .search-box svg {
      position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
      pointer-events: none; color: #9aa0a6;
    }
    .search-box input {
      width: 100%; padding: 14px 18px 14px 48px;
      border: 1px solid #dfe1e5; border-radius: 24px;
      font-size: 16px; outline: none; transition: box-shadow .2s;
    }
    .search-box input:focus {
      border-color: transparent; box-shadow: 0 1px 6px rgba(32,33,36,.28);
    }

    /* Results */
    .results-wrap {
      max-width: 700px; margin: 0 auto; padding: 0 20px 60px;
    }
    .result-count {
      font-size: 13px; color: #70757a; margin-bottom: 12px;
    }
    .result-empty {
      text-align: center; padding: 60px 0;
    }
    .result-empty h3 { font-size: 18px; color: #202124; margin-bottom: 8px; font-weight: 400; }
    .result-empty p { font-size: 14px; color: #70757a; }
    .result-empty svg { margin-bottom: 16px; opacity: .4; }

    .server-card {
      padding: 12px 0; border-bottom: 1px solid #f1f3f4; cursor: pointer;
      transition: background .15s;
    }
    .server-card:hover { background: #fafafa; margin: 0 -20px; padding-left: 20px; padding-right: 20px; }
    .server-card .name {
      color: #1a0dab; font-size: 18px; font-weight: 400; margin-bottom: 4px;
    }
    .server-card .name:visited { color: #609; }
    .server-card .ip-row { font-size: 14px; color: #006621; margin-bottom: 4px; }
    .server-card .desc { font-size: 14px; color: #545454; line-height: 1.58; margin-bottom: 4px; }
    .server-card .meta { font-size: 12px; color: #70757a; display: flex; gap: 12px; align-items: center; }
    .server-card .meta .dot {
      display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px;
    }
    .server-card .meta .dot.online { background: #1e8e3e; }
    .server-card .meta .dot.offline { background: #dadce0; }
    .dormant-tag {
      font-size: 11px; color: #70757a; background: #f1f3f4;
      padding: 2px 8px; border-radius: 10px;
    }

    @media (max-width: 600px) {
      .search-wrap { margin: 40px auto 30px; }
      .header h1 { font-size: 0; }
      .header { padding: 8px 12px; }
      .results-wrap { padding: 0 12px 40px; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="header-left">
    <div class="logo">M</div>
    <h1>Server Monitor</h1>
  </div>
  <div class="header-right">
    <a href="/search.html" class="active">搜索</a>
    <a href="/">首页</a>
    <a href="/admin.html">管理</a>
  </div>
</header>

<!-- Search -->
<div class="search-wrap">
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="searchInput" placeholder="搜索服务器..." autofocus>
  </div>
</div>

<!-- Results -->
<div class="results-wrap" id="resultsWrap">
  <div class="result-count" id="resultCount"></div>
  <div id="resultList"></div>
</div>

<script>
const input = document.getElementById('searchInput');
const list = document.getElementById('resultList');
const count = document.getElementById('resultCount');
let timer;

input.addEventListener('input', () => {
  clearTimeout(timer);
  const q = input.value.trim();
  if (!q) { list.innerHTML = ''; count.textContent = ''; return; }
  timer = setTimeout(() => doSearch(q), 300);
});

async function doSearch(q) {
  list.innerHTML = '<div class="result-empty"><p>搜索中...</p></div>';
  try {
    const res = await fetch('/api/servers?q=' + encodeURIComponent(q) + '&show=all');
    const data = await res.json();
    render(data, q);
  } catch(e) {
    list.innerHTML = '<div class="result-empty"><h3>搜索出错</h3><p>请检查网络后重试</p></div>';
  }
}

function render(arr, q) {
  if (!arr || arr.length === 0) {
    count.textContent = '';
    list.innerHTML = `
      <div class="result-empty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#9aa0a6" stroke-width="1"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><line x1="8" y1="8" x2="14" y2="14"/></svg>
        <h3>没有找到「${esc(q)}」相关的结果</h3>
        <p>试试其他关键词</p>
      </div>`;
    return;
  }
  count.textContent = `找到约 ${arr.length} 条结果`;
  list.innerHTML = arr.map(s => {
    const online = s.online === 1;
    const ip = s.port && s.port !== 25565 ? s.ip + ':' + s.port : s.ip;
    return `<div class="server-card" onclick="location.href='/'">
      <div class="name">${esc(s.name)}</div>
      <div class="ip-row">${esc(ip)}</div>
      <div class="desc">${esc(s.description || '暂无简介')}</div>
      <div class="meta">
        <span><span class="dot ${online ? 'online' : 'offline'}"></span>${online ? (s.players_online + ' 人在线') : '离线'}</span>
        <span>${s.latency >= 0 ? s.latency + 'ms' : '-'}</span>
        ${s.version ? '<span>' + esc(shortV(s.version)) + '</span>' : ''}
        ${s.status === 'dormant' ? '<span class="dormant-tag">休眠</span>' : ''}
      </div>
    </div>`;
  }).join('');
}

function esc(s) { if (!s) return ''; const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function shortV(v) { const m = v.match(/([\d.]+)/); return m ? m[1] : v.slice(0,12); }
</script>
</body>
</html>
